[package]
name = "tomo"
version = "0.1.0"
description = "Local-first personal communication assistant"
authors = ["Tomo contributors"]
edition = "2021"
[lib]
name = "tomo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "form", "query"] }
rusqlite = { version = "0.40", features = ["bundled"] }
aes-gcm = "0.11"
rand = "0.10"
base64 = "0.23"
sha2 = "0.11"
keyring = "4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
webbrowser = "1"
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
async-trait = "0.1"
mailparse = "0.18"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tauri-plugin-deep-link = "2"
[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Host proc-macro dylibs must retain their metadata and correctly aligned Mach-O sections.
[profile.release.build-override]
strip = false
